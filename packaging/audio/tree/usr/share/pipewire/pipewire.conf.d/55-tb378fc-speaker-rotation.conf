# SPDX-License-Identifier: MIT
# Lenovo Xiaoxin Pad Pro GT 13 (TB378FC) 4-Speaker Acoustic Protection,
# Enclosure Calibration EQ (derived from stock ZUXOS dax-default.xml
# speaker_landscape 4ch audio-optimizer), and Dynamic 0/90/180/270 Rotation.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Internal speakers"
      filter.graph = {
        nodes = [
          { type = builtin name = copyFL label = copy }
          { type = builtin name = copyFR label = copy }
          { type = builtin name = copyRL label = copy }
          { type = builtin name = copyRR label = copy }

          # 85 Hz 2nd-order Butterworth High-Pass (excursion protection at high volume)
          { type = builtin name = hpfFL label = bq_highpass control = { "Freq" = 85.0 "Q" = 0.7071 } }
          { type = builtin name = hpfFR label = bq_highpass control = { "Freq" = 85.0 "Q" = 0.7071 } }
          { type = builtin name = hpfRL label = bq_highpass control = { "Freq" = 85.0 "Q" = 0.7071 } }
          { type = builtin name = hpfRR label = bq_highpass control = { "Freq" = 85.0 "Q" = 0.7071 } }

          # Band 1: 180 Hz +1.2 dB low-mid warmth (DAX 141-234 Hz)
          { type = builtin name = eq1FL label = bq_peaking control = { "Freq" = 180.0 "Q" = 1.0 "Gain" = 1.2 } }
          { type = builtin name = eq1FR label = bq_peaking control = { "Freq" = 180.0 "Q" = 1.0 "Gain" = 1.2 } }
          { type = builtin name = eq1RL label = bq_peaking control = { "Freq" = 180.0 "Q" = 1.0 "Gain" = 1.2 } }
          { type = builtin name = eq1RR label = bq_peaking control = { "Freq" = 180.0 "Q" = 1.0 "Gain" = 1.2 } }

          # Band 2: 560 Hz -6.2 dB chassis cavity resonance notch (DAX 469-656 Hz)
          { type = builtin name = eq2FL label = bq_peaking control = { "Freq" = 560.0 "Q" = 1.1 "Gain" = -6.2 } }
          { type = builtin name = eq2FR label = bq_peaking control = { "Freq" = 560.0 "Q" = 1.1 "Gain" = -6.2 } }
          { type = builtin name = eq2RL label = bq_peaking control = { "Freq" = 560.0 "Q" = 1.1 "Gain" = -6.2 } }
          { type = builtin name = eq2RR label = bq_peaking control = { "Freq" = 560.0 "Q" = 1.1 "Gain" = -6.2 } }

          # Band 3: 4200 Hz -7.8 dB upper-mid harshness / cone breakup notch (DAX 3750-4688 Hz)
          { type = builtin name = eq3FL label = bq_peaking control = { "Freq" = 4200.0 "Q" = 1.3 "Gain" = -7.8 } }
          { type = builtin name = eq3FR label = bq_peaking control = { "Freq" = 4200.0 "Q" = 1.3 "Gain" = -7.8 } }
          { type = builtin name = eq3RL label = bq_peaking control = { "Freq" = 4200.0 "Q" = 1.3 "Gain" = -7.8 } }
          { type = builtin name = eq3RR label = bq_peaking control = { "Freq" = 4200.0 "Q" = 1.3 "Gain" = -7.8 } }

          # Band 4: 10200 Hz -4.5 dB treble balance (DAX 9000-11250 Hz)
          { type = builtin name = eq4FL label = bq_peaking control = { "Freq" = 10200.0 "Q" = 1.4 "Gain" = -4.5 } }
          { type = builtin name = eq4FR label = bq_peaking control = { "Freq" = 10200.0 "Q" = 1.4 "Gain" = -4.5 } }
          { type = builtin name = eq4RL label = bq_peaking control = { "Freq" = 10200.0 "Q" = 1.4 "Gain" = -4.5 } }
          { type = builtin name = eq4RR label = bq_peaking control = { "Freq" = 10200.0 "Q" = 1.4 "Gain" = -4.5 } }

          # 4x4 orientation routing matrix controlled dynamically by tb378fc-speaker-rotation
          { type = builtin name = outFL label = mixer control = { "Gain 1" = 1.0 "Gain 2" = 0.0 "Gain 3" = 0.0 "Gain 4" = 0.0 } }
          { type = builtin name = outFR label = mixer control = { "Gain 1" = 0.0 "Gain 2" = 1.0 "Gain 3" = 0.0 "Gain 4" = 0.0 } }
          { type = builtin name = outRL label = mixer control = { "Gain 1" = 0.0 "Gain 2" = 0.0 "Gain 3" = 1.0 "Gain 4" = 0.0 } }
          { type = builtin name = outRR label = mixer control = { "Gain 1" = 0.0 "Gain 2" = 0.0 "Gain 3" = 0.0 "Gain 4" = 1.0 } }
        ]
        links = [
          { output = "copyFL:Out" input = "hpfFL:In" }
          { output = "hpfFL:Out"  input = "eq1FL:In" }
          { output = "eq1FL:Out"  input = "eq2FL:In" }
          { output = "eq2FL:Out"  input = "eq3FL:In" }
          { output = "eq3FL:Out"  input = "eq4FL:In" }

          { output = "copyFR:Out" input = "hpfFR:In" }
          { output = "hpfFR:Out"  input = "eq1FR:In" }
          { output = "eq1FR:Out"  input = "eq2FR:In" }
          { output = "eq2FR:Out"  input = "eq3FR:In" }
          { output = "eq3FR:Out"  input = "eq4FR:In" }

          { output = "copyRL:Out" input = "hpfRL:In" }
          { output = "hpfRL:Out"  input = "eq1RL:In" }
          { output = "eq1RL:Out"  input = "eq2RL:In" }
          { output = "eq2RL:Out"  input = "eq3RL:In" }
          { output = "eq3RL:Out"  input = "eq4RL:In" }

          { output = "copyRR:Out" input = "hpfRR:In" }
          { output = "hpfRR:Out"  input = "eq1RR:In" }
          { output = "eq1RR:Out"  input = "eq2RR:In" }
          { output = "eq2RR:Out"  input = "eq3RR:In" }
          { output = "eq3RR:Out"  input = "eq4RR:In" }

          { output = "eq4FL:Out" input = "outFL:In 1" }
          { output = "eq4FR:Out" input = "outFL:In 2" }
          { output = "eq4RL:Out" input = "outFL:In 3" }
          { output = "eq4RR:Out" input = "outFL:In 4" }
          { output = "eq4FL:Out" input = "outFR:In 1" }
          { output = "eq4FR:Out" input = "outFR:In 2" }
          { output = "eq4RL:Out" input = "outFR:In 3" }
          { output = "eq4RR:Out" input = "outFR:In 4" }
          { output = "eq4FL:Out" input = "outRL:In 1" }
          { output = "eq4FR:Out" input = "outRL:In 2" }
          { output = "eq4RL:Out" input = "outRL:In 3" }
          { output = "eq4RR:Out" input = "outRL:In 4" }
          { output = "eq4FL:Out" input = "outRR:In 1" }
          { output = "eq4FR:Out" input = "outRR:In 2" }
          { output = "eq4RL:Out" input = "outRR:In 3" }
          { output = "eq4RR:Out" input = "outRR:In 4" }
        ]
        inputs = [ "copyFL:In" "copyFR:In" "copyRL:In" "copyRR:In" ]
        outputs = [ "outFL:Out" "outFR:Out" "outRL:Out" "outRR:Out" ]
      }
      capture.props = {
        node.name = "tb378fc-speaker-rotation-input"
        node.description = "Internal speakers"
        media.class = Audio/Sink
        audio.position = [ FL FR RL RR ]
        filter.smart = true
        filter.smart.target = { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" }
      }
      playback.props = {
        node.name = "tb378fc-speaker-rotation-output"
        node.passive = true
        audio.position = [ FL FR RL RR ]
        stream.dont-remix = true
      }
    }
  }
]
