# Lenovo TB378FC (Qualcomm WCN7860 / FastConnect 7800) Bluetooth audio policy:
# - Enable SBC-XQ Dual-Channel high-bitrate mode, mSBC/LC3-SWB wideband HFP, and AVRCP/HFP hardware volume
# - Default AAC to CBR (bitratemode = 0, up to 320 kbps) for broad TWS DSP compatibility (1..5 selects VBR)
# - Default LDAC to adaptive bitrate ("auto": 990/660/330 kbps) paired with WCN7860 AOSP BQR link telemetry
monitor.bluez.properties = {
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true
  bluez5.a2dp.aac.bitratemode = 0
  bluez5.a2dp.ldac.quality = "auto"
}
