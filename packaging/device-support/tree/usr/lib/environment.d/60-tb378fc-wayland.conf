# Native Wayland defaults for Electron, Chromium, Firefox, Qt, and SDL on Lenovo TB378FC (Adreno 830).
# Users can override any variable in ~/.config/environment.d/.
ELECTRON_OZONE_PLATFORM_HINT=auto
OZONE_PLATFORM_HINT=auto
NIXOS_OZONE_WL=1
MOZ_ENABLE_WAYLAND=1
QT_QPA_PLATFORM="wayland;xcb"
SDL_VIDEODRIVER="wayland,x11"
