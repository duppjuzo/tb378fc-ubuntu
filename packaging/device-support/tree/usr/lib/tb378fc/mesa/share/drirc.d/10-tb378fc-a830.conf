<?xml version="1.0"?>
<!--
    Workaround for Adreno 830 (a8xx / Gen8) Freedreno Mesa 26.2.6 coherent
    GL_EXT_shader_framebuffer_fetch corruption in Chromium/Electron LCD
    subpixel text rendering. Disabling the fbfetch extensions makes Skia
    fall back to hardware GL_EXT_blend_func_extended (dual-source blending)
    while preserving GPU rasterization and Iris VA-API video acceleration.

    Exit condition: remove once upstream Mesa fixes a8xx coherent fbfetch.
-->
<driconf>
    <device driver="msm">
        <application name="Default">
            <option name="mesa_extension_override" value="-GL_EXT_shader_framebuffer_fetch -GL_EXT_shader_framebuffer_fetch_non_coherent"/>
        </application>
    </device>
</driconf>
