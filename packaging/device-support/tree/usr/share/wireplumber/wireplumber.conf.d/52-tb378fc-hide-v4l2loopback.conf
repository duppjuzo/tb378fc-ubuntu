# Hide TB378FC v4l2loopback virtual webcams from PipeWire to avoid duplicate cameras or loops.
monitor.v4l2.rules = [
  {
    matches = [
      { api.v4l2.cap.driver = "v4l2 loopback" }
    ]
    actions = {
      update-props = {
        node.disabled = true
        device.disabled = true
      }
    }
  }
]
