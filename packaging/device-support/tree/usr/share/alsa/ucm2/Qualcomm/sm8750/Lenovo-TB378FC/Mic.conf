# SPDX-License-Identifier: BSD-3-Clause
# Dual built-in analog microphones on Lenovo TB378FC:
#  - AMIC1 (MIC BIAS1) -> WCD9390 ADC1 (TX0) -> Slave Port 1 ch0 -> Master DP3 -> SWR_MIC4 -> TX DEC0
#  - AMIC4 (MIC BIAS4) -> WCD9390 ADC3 (TX2) -> Slave Port 1 ch2 -> Master DP3 -> SWR_MIC6 -> TX DEC1
#  - +18 dB digital decimator gain (102, 84 = 0 dB) + 75 Hz high-pass rumble filter
SectionDevice."Mic" {
	Comment "Internal Microphones"
	EnableSequence [
		cset "name='TX0 MODE' ADC_LP"
		cset "name='TX2 MODE' ADC_LP"
		cset "name='ADC1 MUX' CH1_AMIC1"
		cset "name='ADC3 MUX' CH3_AMIC4"
		cset "name='ADC1 Volume' 12"
		cset "name='ADC3 Volume' 12"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC3 Switch' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC3_MIXER Switch' 1"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC4"
		cset "name='TX SMIC MUX1' SWR_MIC6"
		cset "name='DEC0 MODE' ADC_HIGH_PERF"
		cset "name='DEC1 MODE' ADC_HIGH_PERF"
		cset "name='TX0 HPF cut off' CF_NEG_3DB_75HZ"
		cset "name='TX1 HPF cut off' CF_NEG_3DB_75HZ"
		cset "name='TX_DEC0 Volume' 102"
		cset "name='TX_DEC1 Volume' 102"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
	]
	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='ADC3_MIXER Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC3 Switch' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX DEC1 MUX' MSM_DMIC"
		cset "name='TX DEC0 MUX' MSM_DMIC"
		cset "name='TX2 MODE' ADC_INVALID"
		cset "name='TX0 MODE' ADC_INVALID"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 2
		CaptureRate 48000
	}
}
