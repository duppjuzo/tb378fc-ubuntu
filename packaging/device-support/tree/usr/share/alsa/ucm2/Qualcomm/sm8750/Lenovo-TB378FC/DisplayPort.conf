# USB-C DisplayPort / HDMI external audio output for Lenovo TB378FC.
# ACP opens PCMs while probing HiFi before enabling individual devices.
SectionVerb {
	EnableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 1"
	]
	DisableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia2' 0"
	]
}

SectionDevice."HDMI" {
	Comment "HDMI / DisplayPort"
	EnableSequence [
		cset "name='stream1.vol_ctrl1 MultiMedia2 Playback Volu' 8192"
	]
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackChannels 2
		PlaybackRate 48000
		JackControl "DP0 Jack"
	}
}
