# SPDX-License-Identifier: BSD-3-Clause
# ALSA UCM2 HiFi profile for Lenovo Xiaoxin Pad Pro GT 13 (TB378FC):
#  - Quad AW88480 speakers (6 dB below native ceiling for uncalibrated protection)
#  - USB-C DisplayPort external audio (gated on DP0 Jack)
#  - Dual WCD9390 SoundWire microphones (AMIC1/ADC1 + AMIC4/ADC3)
SectionVerb {
	EnableSequence [
		cset "name='Secondary TDM0 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]
	DisableSequence [
		cset "name='Secondary TDM0 Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"
	EnableSequence [
		cset "name='Amp0 Playback Volume' 487"
		cset "name='Amp1 Playback Volume' 487"
		cset "name='Amp2 Playback Volume' 487"
		cset "name='Amp3 Playback Volume' 487"
		cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 8192"
	]
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 4
		PlaybackRate 48000
	}
}

If.displayport {
	Condition {
		Type ControlExists
		Control "iface=CARD,name='DP0 Jack'"
	}
	True.Include.displayport.File "/Qualcomm/sm8750/Lenovo-TB378FC/DisplayPort.conf"
}

Include.mic.File "Mic.conf"
