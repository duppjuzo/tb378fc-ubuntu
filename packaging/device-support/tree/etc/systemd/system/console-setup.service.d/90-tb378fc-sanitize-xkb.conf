[Service]
# Strip invalid IBus "default" XKB layout tokens written by gnome-initial-setup
ExecStartPre=-/bin/sh -c 'if [ -f /etc/default/keyboard ]; then sed -i -E "s/^XKBLAYOUT=\"default,([^\"]+)\"/XKBLAYOUT=\"\1\"/; s/^XKBLAYOUT=\"([^\"]+),(default)\"/XKBLAYOUT=\"\1\"/; s/^XKBLAYOUT=\"default\"/XKBLAYOUT=\"us\"/; s/^XKBVARIANT=\",([^\"]*)\"/XKBVARIANT=\"\1\"/" /etc/default/keyboard 2>/dev/null || true; fi'
