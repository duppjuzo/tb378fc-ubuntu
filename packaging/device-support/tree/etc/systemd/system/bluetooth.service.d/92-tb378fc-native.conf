[Unit]
Wants=tb378fc-bluetooth-address.service
After=tb378fc-bluetooth-address.service

[Service]
# Enable Android/AOSP Bluetooth Quality Report (BQR: 330859bc-7506-492d-9370-9a6f0614037f)
# on Qualcomm WCN7860 (CONFIG_BT_AOSPEXT=y) so PipeWire receives real-time RF packet-loss
# telemetry for adaptive LDAC/Opus/SBC-XQ bitrates without turning on Codec Offload or LL Privacy.
# Optional LE Audio (BAP/LC3): add --experimental and append ,6fbaf188-05e0-496a-9885-d6ddfdb4e03e
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --kernel=330859bc-7506-492d-9370-9a6f0614037f
