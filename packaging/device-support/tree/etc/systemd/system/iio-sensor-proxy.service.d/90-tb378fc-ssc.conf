[Unit]
Wants=tb378fc-sensors-rpcd.service
After=tb378fc-sensors-rpcd.service

[Service]
ExecStart=
ExecStart=/bin/sh -c 'if [ -x /usr/lib/tb378fc/sensors/libexec/iio-sensor-proxy ]; then exec /usr/lib/tb378fc/sensors/libexec/iio-sensor-proxy; else exec /usr/libexec/iio-sensor-proxy; fi'
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX AF_LOCAL AF_NETLINK AF_QIPCRTR
