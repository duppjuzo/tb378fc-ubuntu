# Allow the Qualcomm Iris VA-API driver, which is not in GStreamer's built-in vendor list.
GST_VA_ALL_DRIVERS=1
# Prefer Iris-backed VA decoders over generic V4L2 in GStreamer; respect user overrides.
GST_PLUGIN_FEATURE_RANK=${GST_PLUGIN_FEATURE_RANK:-vah264dec:512,vah265dec:512,vavp9dec:512}
