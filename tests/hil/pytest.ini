[pytest]
testpaths = .
python_files = test_*.py
markers =
    boot: kernel release, taint=0, cmdline, systemd, pstore, dmesg errors
    display: DRM/KMS connectors, NT36526 60/120/144Hz modes, dual AW99706B backlight, touch IRQ
    gpu: Adreno A830 OpenGL/Vulkan/Mesa freedreno & turnip checks
    media: Qualcomm Iris V4L2/VAAPI hardware video decode/encode nodes
    audio: AW88480 speakers, WCD939x codec/mic, SoundWire/ALSA cards
    camera: CAMSS, GC08A8, OV13B10, PM8550 flash LED, libcamera devices
    power: battery/qcom_battmgr, USB-C/Type-C, s2idle freeze & RPMh CX collapse stats
    connectivity: WCN7860 Wi-Fi (ath12k), Bluetooth UART/HCI, USB-C/DP
    slow: active stress or sleep-cycle tests (opt-in with --run-active)
